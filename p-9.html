<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100 font-[Poppins]">

  <div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block bg-white p-3 rounded-2xl shadow-md mb-4">
        📝
      </div>

      <h1 class="text-4xl font-bold text-gray-800">
        My To-Do List
      </h1>

      <p class="text-gray-500 mt-2">
        Keep your academic and personal tasks organized
      </p>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-xl p-6">

      <!-- Add Task -->
      <div class="space-y-3 mb-6">

        <input
          id="taskInput"
          type="text"
          placeholder="What do you need to do?"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-400"
        >

        <div class="flex gap-3">

          <select
            id="categoryInput"
            class="flex-1 px-4 py-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-400"
          >
            <option value="Academic">📚 Academic</option>
            <option value="Personal">🌸 Personal</option>
          </select>

          <button
            onclick="addTask()"
            class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-semibold transition"
          >
            + Add
          </button>

        </div>
      </div>

      <!-- Statistics -->
      <div class="grid grid-cols-3 gap-3 mb-6">

        <div class="bg-purple-50 rounded-2xl p-4 text-center">
          <p id="totalTasks" class="text-2xl font-bold text-purple-600">0</p>
          <p class="text-sm text-gray-500">Total</p>
        </div>

        <div class="bg-pink-50 rounded-2xl p-4 text-center">
          <p id="completedTasks" class="text-2xl font-bold text-pink-600">0</p>
          <p class="text-sm text-gray-500">Completed</p>
        </div>

        <div class="bg-indigo-50 rounded-2xl p-4 text-center">
          <p id="pendingTasks" class="text-2xl font-bold text-indigo-600">0</p>
          <p class="text-sm text-gray-500">Pending</p>
        </div>

      </div>

      <!-- Task List -->
      <div id="taskList" class="space-y-3"></div>

      <!-- Empty Message -->
      <div id="emptyMessage" class="text-center py-10">
        <div class="text-4xl mb-3">✨</div>
        <p class="text-lg font-semibold text-gray-600">
          No tasks yet
        </p>
        <p class="text-sm text-gray-400 mt-1">
          Add your first task above!
        </p>
      </div>

    </div>

    <p class="text-center text-gray-400 text-sm mt-6">
      Stay organized • Stay productive ✨
    </p>

  </div>

  <script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function addTask() {

      let input = document.getElementById("taskInput");
      let category = document.getElementById("categoryInput");

      let text = input.value.trim();

      if (text === "") {
        alert("Please enter a task!");
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        category: category.value,
        completed: false
      });

      saveTasks();

      input.value = "";

      showTasks();
    }

    function completeTask(id) {

      for (let task of tasks) {
        if (task.id === id) {
          task.completed = !task.completed;
        }
      }

      saveTasks();
      showTasks();
    }

    function deleteTask(id) {

      tasks = tasks.filter(function(task) {
        return task.id !== id;
      });

      saveTasks();
      showTasks();
    }

    function showTasks() {

      let list = document.getElementById("taskList");
      let empty = document.getElementById("emptyMessage");

      list.innerHTML = "";

      if (tasks.length === 0) {
        empty.classList.remove("hidden");
      } else {
        empty.classList.add("hidden");
      }

      for (let task of tasks) {

        let div = document.createElement("div");

        div.className =
          "flex items-center gap-3 p-4 bg-gray-50 border border-gray-100 rounded-2xl hover:shadow-md transition";

        let category =
          task.category === "Academic"
          ? "bg-purple-100 text-purple-700"
          : "bg-pink-100 text-pink-700";

        div.innerHTML = `
          
          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onclick="completeTask(${task.id})"
            class="w-5 h-5 accent-purple-600 cursor-pointer"
          >

          <div class="flex-1">

            <p class="font-medium ${
              task.completed
              ? "line-through text-gray-400"
              : "text-gray-700"
            }">
              ${task.text}
            </p>

            <span class="inline-block mt-1 px-3 py-1 text-xs rounded-full ${category}">
              ${task.category}
            </span>

          </div>

          <button
            onclick="deleteTask(${task.id})"
            class="text-red-400 hover:text-red-600 text-lg px-2"
          >
            🗑️
          </button>

        `;

        list.appendChild(div);
      }

      updateStats();
    }

    function updateStats() {

      let total = tasks.length;

      let completed = tasks.filter(function(task) {
        return task.completed;
      }).length;

      let pending = total - completed;

      document.getElementById("totalTasks").innerText = total;
      document.getElementById("completedTasks").innerText = completed;
      document.getElementById("pendingTasks").innerText = pending;
    }

    document.getElementById("taskInput").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        addTask();
      }

    });

    showTasks();

  </script>

</body>
</html>
